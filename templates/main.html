<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domača stran</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f8fa;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            text-align: center;
        }

        nav {
            background-color: #34495e;
            text-align: center;
            padding: 0.5rem;
        }

        nav a {
            color: white;
            margin: 0 1rem;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 2rem;
            text-align: center;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1rem;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dobrodošel na moji strani!</h1>
    </header>

    <nav>
        <a href="/">Domov</a>
        <a href="/about">O meni</a>
        <a href="/contact">Kontakt</a>
    </nav>

    <main>
        <h2>{{ime_podjetja}}</h2>
        <p>Lahko ga poljubno spremeniš, dodaš slike, gumbe ali povezave.</p>
        <a href="/test/"><button class="login-button">Prijava</button></a>
    </main>

    <footer>
        <p>&copy; 2025 Moja Flask Stran</p>
    </footer>

</body>
</html>
